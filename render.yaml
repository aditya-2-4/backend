services:
  - type: web
    name: farmguard-ai-service
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: SHARED_API_KEY
        value: secure_esp32_device_shared_api_key_2026
      - key: BACKEND_EVENT_URL
        value: https://backend-8-yt04.onrender.com/api/device/event
